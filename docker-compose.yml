# Entorno de DESARROLLO. En produccion: Vercel (frontends), Railway/Render
# (servicios MCP) y bases administradas. Ver docs/README_TECNICO.md
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duobot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Segunda base de cada proyecto. Motor provisional: MongoDB.
  # Si el equipo elige otro (DuckDB, otro Postgres), se ajusta aqui.
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db

  mcp-estudiantes:
    build: ./services/mcp-estudiantes
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: ${ESTUDIANTES_DATABASE_URL_DOCKER:-postgresql+psycopg://duobot:${POSTGRES_PASSWORD}@postgres:5432/duobot_estudiantes_app}
      MONGO_URL: mongodb://mongo:27017/duobot_estudiantes_analytics
      FRONTEND_URL: ${ESTUDIANTES_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8001:8000"
    volumes:
      - ./services/mcp-estudiantes/app:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  mcp-admin:
    build: ./services/mcp-admin
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL_DOCKER:-postgresql+psycopg://duobot:${POSTGRES_PASSWORD}@postgres:5432/duobot_admin_app}
      MONGO_URL: mongodb://mongo:27017/duobot_admin_analytics
      FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:3001}
    ports:
      - "8002:8000"
    volumes:
      - ./services/mcp-admin/app:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

volumes:
  pgdata:
  mongodata:
